<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>mindbox</title><style>/*__CSS__*/</style></head><body>
<header class="reader-head"><div class="reader-title"><span class="reader-mark" aria-hidden="true">✳</span><h1 id="document-title"></h1></div><div id="style-choices" class="style-choices" role="group" aria-label="切换导图与 Markdown"></div><div class="reader-actions"><button id="play" class="play-button">▶ 阅读演示</button><div class="export-group"><button id="export-menu-toggle" aria-haspopup="true" aria-expanded="false" aria-controls="export-menu">导出 <span aria-hidden="true">⌄</span></button></div></div></header>
<main id="stage" tabindex="0" aria-label="思维导图：单击选中，双击改字，节点旁按钮折叠或展开，拖动空白平移"></main>
<section id="markdown-panel" class="markdown-panel" aria-label="Markdown 编辑" hidden><div class="markdown-heading"><label for="markdown-editor">把想法写下来</label><span>在 mindmap 中用缩进表示层级 · Tab 缩进 · Ctrl / ⌘ + Enter 查看导图</span></div><textarea id="markdown-editor" aria-label="Markdown 内容" aria-describedby="markdown-help markdown-error" maxlength="120000" spellcheck="false" wrap="off"></textarea><div class="markdown-status"><span id="markdown-help">与导图共用文字和层级 · 修改后点击上方样式查看。</span><span id="markdown-error" role="status" aria-live="polite"></span></div></section>
<button id="branch-toggle" type="button" aria-label="收起子节点" aria-keyshortcuts="Space" hidden><span class="branch-mark" aria-hidden="true">−</span></button>
<textarea id="node-editor" aria-label="修改节点文字" maxlength="500" rows="1" spellcheck="false" hidden></textarea>
<footer class="reader-foot"><div class="reader-info"><span id="map-info"></span><span id="edit-hint">单击选中 · 双击改字 · 节点旁 − / 数字折叠展开</span></div><div><button id="expand">全部展开</button><button id="zoom-out" aria-label="缩小">−</button><button id="zoom-level" type="button" title="100% 为样式原始字号；点击恢复原始大小">100%</button><button id="zoom-in" aria-label="放大">＋</button><button id="fit">适应画布</button><button id="save-html" title="保存当前内容与样式为单个离线 HTML，双击即可打开">保存 HTML</button></div></footer>
<section id="reading-bar" class="reading-bar" aria-label="阅读指引" hidden><div class="reading-copy"><span id="reading-count"></span><strong id="reading-label"></strong><small id="reading-path"></small></div><div class="reading-controls"><button id="previous-step" aria-label="上一步">←</button><button id="pause">暂停</button><button id="next-step" aria-label="下一步">→</button><button id="stop">结束</button></div><div class="reading-track"><span id="reading-progress"></span></div></section>
<div id="export-menu" class="export-menu" aria-label="导出思维导图" hidden><button data-export="png"><b>图像</b><span>PNG · 无损图像，按内容计算尺寸</span></button><button data-export="animated-webp"><b>动图</b><span>WebP · 按文字大小逐段聚焦</span></button><p>包含全部节点；尺寸和镜头按内容计算，不受当前缩放和折叠影响。</p></div>
<div id="export-status" class="export-status" role="status" aria-live="polite" hidden></div>
<script>/*__BOOT__*/</script><script>/*__LIBRARY__*/</script><script>/*__ENGINE__*/</script><script>/*__APP__*/</script></body></html>
